<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS Arc Reactor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      :root {
        --bg: #0b0e14;
        --panel: rgba(12, 16, 24, 0.75);
        --gold: #ffb000;
        --amber: #ff7a18;
        --text: #f4f0ea;
        --muted: #a8b0c0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: radial-gradient(circle at center, #111827 0%, #0A0E17 40%, #05070b 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
      }

      #app {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        height: 100vh;
      }

      .left-panel {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.01);
      }

      .reactor-wrap {
        position: relative;
        width: min(74vmin, 700px);
        height: min(74vmin, 700px);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle, rgba(255,167,38,0.18), rgba(255,122,24,0.07), transparent 60%);
      }

      #reactor {
        width: 100%;
        height: 100%;
        display: block;
      }

      .right-panel {
        padding: 24px;
        background: rgba(8, 10, 15, 0.78);
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }

      .title {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .status {
        font-size: 0.82rem;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #20f0a0;
        box-shadow: 0 0 12px #20f0a0;
        margin-right: 8px;
      }

      .log-panel {
        flex: 1;
        background: rgba(14, 17, 22, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        overflow: auto;
        padding: 14px;
        box-shadow: inset 0 0 20px rgba(255,176,0,0.08);
      }

      .log-entry {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        font-size: 0.86rem;
        color: #dfe7ff;
      }

      .log-time {
        color: var(--gold);
        min-width: 72px;
      }

      .log-message {
        white-space: pre-wrap;
      }

      .controls {
        margin-top: 18px;
        display: grid;
        gap: 12px;
      }

      .control-btn {
        border: 1px solid rgba(255,176,0,0.4);
        background: linear-gradient(135deg, rgba(255,176,0,0.18), rgba(255,122,24,0.1));
        color: #ffe994;
        border-radius: 10px;
        padding: 12px 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .control-btn:hover {
        box-shadow: 0 0 20px rgba(255,176,0,0.2);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="left-panel">
        <div class="reactor-wrap">
          <canvas id="reactor"></canvas>
        </div>
      </div>

      <aside class="right-panel">
        <div class="header">
          <div class="title">JARVIS</div>
          <div class="status"><span class="status-dot"></span>LIVE</div>
        </div>

        <div class="log-panel" id="logPanel"></div>

        <div class="controls">
          <button class="control-btn" onclick="window.location.reload()">Refresh Feed</button>
        </div>
      </aside>
    </div>

    <script>
      const canvas = document.getElementById('reactor');
      const logPanel = document.getElementById('logPanel');

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
      camera.position.z = 5;

      const group = new THREE.Group();
      scene.add(group);

      const material = new THREE.PointsMaterial({
        color: 0xffb000,
        size: 0.03,
        transparent: true,
        opacity: 0.95
      });

      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const particleCount = 2400;
      for (let i = 0; i < particleCount; i++) {
        const radius = 1.8 + Math.random() * 0.8;
        const angle = Math.random() * Math.PI * 2;
        const y = (Math.random() - 0.5) * 2.8;
        positions.push(
          Math.cos(angle) * radius,
          y,
          Math.sin(angle) * radius
        );
      }
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const particles = new THREE.Points(geometry, material);
      group.add(particles);

      const pulse = new THREE.Mesh(
        new THREE.TorusGeometry(1.6, 0.04, 32, 128),
        new THREE.MeshBasicMaterial({ color: 0xffa000, transparent: true, opacity: 0.9 })
      );
      group.add(pulse);

      function resize() {
        const size = Math.min(window.innerWidth * 0.58, 720);
        renderer.setSize(size, size, false);
        camera.aspect = 1;
        camera.updateProjectionMatrix();
      }

      window.addEventListener('resize', resize);
      resize();

      function animate() {
        requestAnimationFrame(animate);
        const pos = particles.geometry.attributes.position.array;
        for (let i = 0; i < pos.length; i += 3) {
          pos[i] += Math.sin((i + performance.now() * 0.001) * 0.05) * 0.0006;
          pos[i + 1] += Math.cos((i + performance.now() * 0.001) * 0.07) * 0.0004;
        }
        particles.geometry.attributes.position.needsUpdate = true;
        group.rotation.y += 0.005;
        group.rotation.x = Math.sin(performance.now() * 0.0008) * 0.35;
        pulse.rotation.z += 0.01;
        pulse.scale.setScalar(1 + Math.sin(performance.now() * 0.003) * 0.06);
        renderer.render(scene, camera);
      }
      animate();

      async function loadLogs() {
        try {
          const response = await fetch('/get_logs');
          const data = await response.json();
          const logs = data.logs || [];
          logPanel.innerHTML = logs
            .slice(-30)
            .map((item) => `
              <div class="log-entry">
                <div class="log-time">${item.time}</div>
                <div class="log-message">${item.message}</div>
              </div>
            `)
            .join('');
          logPanel.scrollTop = logPanel.scrollHeight;
        } catch (error) {
          console.error('Unable to load logs', error);
        }
      }

      setInterval(loadLogs, 1200);
      loadLogs();
    </script>
  </body>
</html>
