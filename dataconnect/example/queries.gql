mutation CreatePlaylist($title: String!, $description: String, $isPublic: Boolean) @auth(level: USER) {
  playlist_insert(data: {
    title: $title,
    description: $description,
    isPublic: $isPublic,
    userId_expr: "auth.uid"
  })
}

mutation DeletePlaylist($id: UUID!) @auth(level: USER) {
  playlist_delete(key: { id: $id })
}

mutation UpdatePlaylist($id: UUID!, $title: String, $description: String, $isPublic: Boolean) @auth(level: USER) {
  playlist_update(key: { id: $id }, data: {
    title: $title,
    description: $description,
    isPublic: $isPublic
  })
}

query GetPlaylist($id: UUID!) @auth(level: USER) {
  playlist(id: $id) {
    id
    title
    description
    isPublic
  }
}

query ListMyPlaylists @auth(level: USER) {
  playlists(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    title
    isPublic
  }
}

mutation AddFavorite($songId: UUID!) @auth(level: USER) {
  favorite_insert(data: {
    songId: $songId,
    userId_expr: "auth.uid",
    timestamp_expr: "request.time"
  })
}

mutation RemoveFavorite($id: UUID!) @auth(level: USER) {
  favorite_delete(key: { id: $id })
}

mutation UpdateFavorite($id: UUID!, $timestamp: Timestamp) @auth(level: USER) {
  favorite_update(key: { id: $id }, data: { timestamp: $timestamp })
}

query GetFavorite($id: UUID!) @auth(level: USER) {
  favorite(id: $id) {
    id
    song { title }
    timestamp
  }
}

query ListMyFavorites @auth(level: USER) {
  favorites(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    song { title }
  }
}

mutation FollowUser($followingId: UUID!) @auth(level: USER) {
  follow_insert(data: {
    followingId: $followingId,
    followerId_expr: "auth.uid"
  })
}

mutation UnfollowUser($id: UUID!) @auth(level: USER) {
  follow_delete(key: { id: $id })
}

mutation UpdateFollow($id: UUID!, $followingId: UUID!) @auth(level: USER) {
  follow_update(key: { id: $id }, data: { followingId: $followingId })
}

query GetFollow($id: UUID!) @auth(level: USER) {
  follow(id: $id) {
    id
    following { username }
  }
}

query ListMyFollowing @auth(level: USER) {
  follows(where: { followerId: { eq_expr: "auth.uid" } }) {
    id
    following { username }
  }
}

mutation CreatePlaylistEntry($playlistId: UUID!, $songId: UUID!) @auth(level: USER) {
  playlistEntry_insert(data: {
    playlistId: $playlistId,
    songId: $songId,
    addedAt_expr: "request.time"
  })
}

mutation DeletePlaylistEntry($id: UUID!) @auth(level: USER) {
  playlistEntry_delete(key: { id: $id })
}

mutation UpdatePlaylistEntry($id: UUID!, $addedAt: Timestamp) @auth(level: USER) {
  playlistEntry_update(key: { id: $id }, data: { addedAt: $addedAt })
}

query GetPlaylistEntry($id: UUID!) @auth(level: USER) {
  playlistEntry(id: $id) {
    id
    song { title }
    addedAt
  }
}

query ListPlaylistEntries($playlistId: UUID!) @auth(level: USER) {
  playlistEntries(where: { playlistId: { eq: $playlistId } }) {
    id
    song { title }
  }
}

mutation CreateSong($title: String!, $duration: Int!, $artistId: UUID!, $albumName: String, $audioUrl: String) @auth(level: USER) {
  song_insert(data: {
    title: $title,
    duration: $duration,
    artistId: $artistId,
    albumName: $albumName,
    audioUrl: $audioUrl
  })
}

mutation DeleteSong($id: UUID!) @auth(level: USER) {
  song_delete(key: { id: $id })
}

mutation UpdateSong($id: UUID!, $title: String, $duration: Int) @auth(level: USER) {
  song_update(key: { id: $id }, data: { title: $title, duration: $duration })
}

query GetSong($id: UUID!) @auth(level: PUBLIC, insecureReason: "Song metadata is public knowledge") {
  song(id: $id) {
    id
    title
    duration
    artist { name }
  }
}

query ListSongs @auth(level: PUBLIC, insecureReason: "Catalog browsing is public") {
  songs(limit: 50) {
    id
    title
  }
}

mutation CreateArtist($name: String!, $genre: String, $bio: String) @auth(level: USER) {
  artist_insert(data: { name: $name, genre: $genre, bio: $bio })
}

mutation DeleteArtist($id: UUID!) @auth(level: USER) {
  artist_delete(key: { id: $id })
}

mutation UpdateArtist($id: UUID!, $name: String, $verifiedStatus: Boolean) @auth(level: USER) {
  artist_update(key: { id: $id }, data: { name: $name, verifiedStatus: $verifiedStatus })
}

query GetArtist($id: UUID!) @auth(level: PUBLIC, insecureReason: "Artist profiles are public") {
  artist(id: $id) {
    id
    name
    genre
    verifiedStatus
  }
}

query ListArtists @auth(level: PUBLIC, insecureReason: "Artist catalog is public") {
  artists(limit: 50) {
    id
    name
  }
}

mutation UpdateUser($id: UUID!, $bio: String, $profileImageUrl: String) @auth(level: USER) {
  user_update(key: { id: $id }, data: { bio: $bio, profileImageUrl: $profileImageUrl })
}

query GetUser($id: UUID!) @auth(level: PUBLIC, insecureReason: "User profiles are visible to others") {
  user(id: $id) {
    id
    username
    bio
    profileImageUrl
  }
}