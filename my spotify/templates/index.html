<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Spotify</title>
    <style>
        :root {
            --bg: #08131b;
            --panel: rgba(15, 30, 40, 0.88);
            --panel-border: rgba(0, 242, 255, 0.45);
            --primary: #00f2ff;
            --primary-soft: rgba(0, 242, 255, 0.18);
            --text: #ebfaff;
            --muted: #a6d7e3;
            --track: #112f39;
            --highlight: #63f5ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, rgba(0, 242, 255, 0.28), transparent 35%),
                linear-gradient(135deg, #08131b, #0e1b25 35%, #08131b);
            color: var(--text);
            padding: 32px 20px;
        }

        .page-shell {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(8, 15, 21, 0.86);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.16);
            overflow: hidden;
        }

        .visualizer-wrap {
            padding: 24px 24px 0;
            background: rgba(0, 0, 0, 0.18);
        }

        .visualizer-scene {
            position: relative;
            height: 180px;
            border-radius: 18px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(7, 18, 22, 0.9), rgba(15, 32, 39, 0.85));
            border: 1px solid rgba(0, 242, 255, 0.18);
            box-shadow: inset 0 0 16px rgba(0, 242, 255, 0.1);
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(7, 18, 22, 0.9), rgba(15, 32, 39, 0.85));
            border: 1px solid rgba(0, 242, 255, 0.18);
            box-shadow: inset 0 0 16px rgba(0, 242, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .visualizer-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(18px);
            opacity: 0.85;
            animation: drift 10s ease-in-out infinite alternate;
        }

        .glow-one {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.56), transparent 68%);
            top: -40px;
            left: -20px;
        }

        .glow-two {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(99, 245, 255, 0.38), transparent 70%);
            right: -30px;
            bottom: -60px;
            animation-delay: 1.5s;
        }

        .floating-card {
            position: absolute;
            width: 160px;
            height: 160px;
            right: 52px;
            top: 10px;
            transform-style: preserve-3d;
            animation: cardOrbit 12s ease-in-out infinite;
            z-index: 2;
        }

        .card-face {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            border: 1px solid rgba(0, 242, 255, 0.5);
            background: linear-gradient(135deg, rgba(18, 60, 71, 0.9), rgba(14, 30, 39, 0.8));
            box-shadow: 0 18px 40px rgba(0, 242, 255, 0.24);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text);
            backface-visibility: hidden;
        }

        .card-front {
            transform: translateZ(18px);
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.22), rgba(16, 67, 77, 0.92));
        }

        .card-back {
            transform: rotateY(180deg) translateZ(18px);
            background: linear-gradient(135deg, rgba(99, 245, 255, 0.24), rgba(18, 59, 68, 0.95));
        }

        .disc-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 242, 255, 0.46);
            background: rgba(0, 242, 255, 0.04);
            box-shadow: inset 0 0 24px rgba(0, 242, 255, 0.14);
            z-index: 2;
            animation: ringSpin 18s linear infinite;
        }

        .ring-one {
            width: 122px;
            height: 122px;
            left: 52px;
            top: 30px;
        }

        .ring-two {
            width: 92px;
            height: 92px;
            left: 66px;
            top: 44px;
            animation-direction: reverse;
            animation-duration: 20s;
            opacity: 0.8;
        }

        .wireframe-layer {
            position: absolute;
            inset: -18% -10% -12%;
            overflow: hidden;
            z-index: 1;
            opacity: 0.85;
            pointer-events: none;
        }

        .wireframe-grid {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)),
                repeating-linear-gradient(
                    0deg,
                    rgba(122, 239, 255, 0.12),
                    rgba(122, 239, 255, 0.12) 1px,
                    transparent 1px,
                    transparent 34px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 125, 214, 0.12),
                    rgba(255, 125, 214, 0.12) 1px,
                    transparent 1px,
                    transparent 34px
                );
            transform: perspective(1200px) rotateX(72deg) translateY(18%);
            transform-origin: center bottom;
            filter: drop-shadow(0 0 20px rgba(0, 242, 255, 0.25));
            animation: gridShift 15s ease-in-out infinite alternate;
        }

        .chrome-emblem {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 180px;
            height: 180px;
            transform: translate(-50%, -50%) rotateX(15deg) rotateY(-18deg);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(120, 122, 128, 0.12), rgba(255, 255, 255, 0.2));
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.45),
                inset 0 -8px 18px rgba(26, 31, 40, 0.32),
                0 20px 45px rgba(0, 242, 255, 0.16);
            z-index: 2;
            overflow: hidden;
            animation: emblemFloat 10s ease-in-out infinite;
        }

        .chrome-emblem::before,
        .chrome-emblem::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
        }

        .chrome-emblem::before {
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.65), transparent 30%, transparent 58%, rgba(255, 255, 255, 0.28));
        }

        .chrome-emblem::after {
            inset: 14px;
            border-radius: 22px;
            border: 1px solid rgba(0, 242, 255, 0.4);
            box-shadow: inset 0 0 16px rgba(255, 82, 182, 0.28);
        }

        .chrome-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.86rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.45);
            z-index: 3;
        }

        .particle-field {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .organic-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .mist-layer {
            position: absolute;
            inset: auto 0 -4% 0;
            height: 56%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(188, 179, 255, 0.18), rgba(255, 130, 205, 0.18), rgba(5, 10, 18, 0));
            filter: blur(26px);
            opacity: 0.8;
            animation: mistPulse 15s ease-in-out infinite alternate;
        }

        .organic-orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(255,185,236,0.5) 22%, rgba(138,132,255,0.28) 42%, rgba(0,0,0,0) 75%);
            box-shadow: inset 0 0 32px rgba(255,255,255,0.12), 0 0 25px rgba(170, 130, 255, 0.22);
            opacity: 0.95;
            animation: orbDrift 18s ease-in-out infinite alternate;
        }

        .orb-one {
            width: 120px;
            height: 120px;
            left: 18%;
            top: 20%;
        }

        .orb-two {
            width: 92px;
            height: 92px;
            right: 22%;
            bottom: 18%;
            animation-delay: 2s;
        }

        .glowing-flower {
            position: absolute;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.75), rgba(255, 120, 214, 0.32), rgba(0, 242, 255, 0.12), transparent 72%);
            filter: blur(0.4px);
            box-shadow: 0 0 18px rgba(255, 120, 214, 0.32);
            animation: flowerBloom 13s ease-in-out infinite;
        }

        .flower-one {
            left: 40%;
            bottom: 12%;
        }

        .flower-two {
            right: 34%;
            top: 18%;
            animation-delay: 1.8s;
        }

        .petal {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 30px;
            height: 44px;
            border-radius: 70% 70% 65% 65%;
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,128,210,0.42), rgba(111,235,255,0.18));
            border: 1px solid rgba(255,255,255,0.35);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.15);
            transform-origin: center 70%;
            opacity: 0.85;
        }

        .petal-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-26px); }
        .petal-2 { transform: translate(-50%, -50%) rotate(45deg) translateY(-26px); }
        .petal-3 { transform: translate(-50%, -50%) rotate(90deg) translateY(-26px); }
        .petal-4 { transform: translate(-50%, -50%) rotate(135deg) translateY(-26px); }
        .petal-5 { transform: translate(-50%, -50%) rotate(180deg) translateY(-26px); }

        .particle {
            position: absolute;
            width: var(--size);
            height: var(--size);
            left: var(--left);
            top: var(--top);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 245, 255, 1), rgba(255, 120, 214, 0.9), rgba(0, 242, 255, 0.25), transparent 75%);
            box-shadow: 0 0 18px rgba(255, 120, 214, 0.45);
            opacity: 0;
            animation: particleFloat var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes drift {
            0% {
                transform: translate3d(-8px, 8px, 0) scale(0.98);
            }
            100% {
                transform: translate3d(16px, -10px, 0) scale(1.06);
            }
        }

        @keyframes cardOrbit {
            0%, 100% {
                transform: rotateX(14deg) rotateY(-18deg) translateY(0);
            }
            50% {
                transform: rotateX(-16deg) rotateY(18deg) translateY(-8px);
            }
        }

        @keyframes ringSpin {
            0% {
                transform: rotateX(68deg) rotateY(0deg) rotateZ(0deg);
            }
            100% {
                transform: rotateX(68deg) rotateY(360deg) rotateZ(360deg);
            }
        }

        @keyframes gridShift {
            0% {
                transform: perspective(1200px) rotateX(72deg) translateY(12%) scale(1.02);
            }
            100% {
                transform: perspective(1200px) rotateX(76deg) translateY(24%) scale(1.08);
            }
        }

        @keyframes emblemFloat {
            0%, 100% {
                transform: translate(-50%, -50%) rotateX(14deg) rotateY(-18deg) translateY(0px);
            }
            50% {
                transform: translate(-50%, -50%) rotateX(-8deg) rotateY(16deg) translateY(-10px);
            }
        }

        @keyframes particleFloat {
            0% {
                transform: translate3d(0, 0, 0) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            50% {
                transform: translate3d(var(--drift-x), calc(var(--drift-y) * -1), 0) scale(1.1);
                opacity: 1;
            }
            100% {
                transform: translate3d(calc(var(--drift-x) * 2), calc(var(--drift-y) * -2), 0) scale(0.5);
                opacity: 0;
            }
        }

        @keyframes orbDrift {
            0% {
                transform: translate3d(-10px, 8px, 0) scale(0.96);
            }
            50% {
                transform: translate3d(12px, -14px, 0) scale(1.06);
            }
            100% {
                transform: translate3d(-18px, 20px, 0) scale(0.98);
            }
        }

        @keyframes flowerBloom {
            0%, 100% {
                transform: translateY(0) scale(0.96) rotate(-6deg);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-8px) scale(1.06) rotate(8deg);
                opacity: 1;
            }
        }

        @keyframes mistPulse {
            0% {
                transform: translateY(4px) scaleX(0.96);
                opacity: 0.6;
            }
            100% {
                transform: translateY(-6px) scaleX(1.05);
                opacity: 0.95;
            }
        }

        .player-panel {
            padding: 24px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
        }

        .player-header h1 {
            margin: 0;
            font-size: clamp(1.8rem, 3vw, 2.6rem);
            letter-spacing: 0.04em;
        }

        .status-pill {
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(0, 242, 255, 0.12);
            color: var(--primary);
            border: 1px solid rgba(0, 242, 255, 0.4);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .now-playing {
            margin: 0 0 18px;
            font-size: 1rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        #current-title {
            margin: 0;
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            color: var(--text);
        }

        .controls {
            display: grid;
            grid-template-columns: auto auto 1fr auto auto;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            padding: 18px;
            background: rgba(14, 32, 41, 0.72);
            border: 1px solid rgba(99, 245, 255, 0.18);
            border-radius: 18px;
        }

        .control-button {
            border: none;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(0, 242, 255, 0.18), rgba(36, 132, 145, 0.22));
            color: var(--text);
            border: 1px solid rgba(0, 242, 255, 0.35);
            font-size: 1rem;
            font-weight: 700;
            padding: 11px 16px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .control-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 16px rgba(0, 242, 255, 0.2);
        }

        .control-button.active {
            background: linear-gradient(180deg, rgba(0, 242, 255, 0.32), rgba(16, 112, 123, 0.3));
            border-color: rgba(0, 242, 255, 0.7);
            box-shadow: 0 0 18px rgba(0, 242, 255, 0.26);
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .progress-wrap input[type="range"],
        .volume-wrap input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .time-label {
            min-width: 120px;
            text-align: right;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 180px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .search-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 18px 0;
            padding: 14px;
            background: rgba(14, 32, 41, 0.72);
            border: 1px solid rgba(99, 245, 255, 0.18);
            border-radius: 16px;
        }

        .search-row input {
            flex: 1;
            border: 1px solid rgba(0, 242, 255, 0.35);
            border-radius: 12px;
            background: rgba(8, 15, 21, 0.9);
            color: var(--text);
            padding: 12px 14px;
            font-size: 1rem;
        }

        .section-header,
        .library-header {
            margin-top: 28px;
            margin-bottom: 14px;
        }

        .section-header h2,
        .library-header h2 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .trending-list {
            display: grid;
            gap: 12px;
            margin-bottom: 16px;
        }

        .trending-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(23, 37, 45, 0.9);
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .trending-art {
            width: 62px;
            height: 62px;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.18), rgba(18, 117, 132, 0.24));
            flex-shrink: 0;
        }

        .trending-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .trending-info {
            flex: 1;
            min-width: 0;
        }

        .trending-title {
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .trending-meta {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .preview-button {
            border: 1px solid rgba(0, 242, 255, 0.45);
            border-radius: 10px;
            padding: 9px 12px;
            background: rgba(0, 242, 255, 0.12);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
        }

        .preview-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 12px;
        }

        .song-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(23, 37, 45, 0.9);
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
        }

        .song-item:hover {
            background: rgba(25, 52, 62, 0.92);
            border-color: rgba(0, 242, 255, 0.26);
            transform: translateY(-1px);
        }

        .song-item.active {
            background: rgba(0, 242, 255, 0.1);
            border-color: rgba(0, 242, 255, 0.45);
        }

        .song-index {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 242, 255, 0.12);
            color: var(--primary);
            font-weight: 700;
        }

        .song-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }

        .song-play {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 242, 255, 0.7);
            color: #03141b;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 760px) {
            .controls {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .progress-wrap {
                grid-column: 1 / -1;
            }

            .volume-wrap {
                justify-self: end;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="visualizer-wrap">
            <div class="visualizer-scene">
                <div class="visualizer-glow glow-one"></div>
                <div class="visualizer-glow glow-two"></div>
                <div class="wireframe-layer" aria-hidden="true">
                    <div class="wireframe-grid"></div>
                </div>
                <div class="disc-ring ring-one" aria-hidden="true"></div>
                <div class="disc-ring ring-two" aria-hidden="true"></div>
                <div class="chrome-emblem" aria-hidden="true">
                    <div class="chrome-label">MIX</div>
                </div>
                <div class="floating-card" aria-hidden="true">
                    <div class="card-face card-front">My Spotify</div>
                    <div class="card-face card-back">Live Mix</div>
                </div>
                <div class="organic-layer" aria-hidden="true">
                    <div class="mist-layer"></div>
                    <div class="organic-orb orb-one"></div>
                    <div class="organic-orb orb-two"></div>
                    <div class="glowing-flower flower-one">
                        <span class="petal petal-1"></span>
                        <span class="petal petal-2"></span>
                        <span class="petal petal-3"></span>
                        <span class="petal petal-4"></span>
                        <span class="petal petal-5"></span>
                    </div>
                    <div class="glowing-flower flower-two">
                        <span class="petal petal-1"></span>
                        <span class="petal petal-2"></span>
                        <span class="petal petal-3"></span>
                        <span class="petal petal-4"></span>
                        <span class="petal petal-5"></span>
                    </div>
                </div>
                <div class="particle-field" id="particle-field" aria-hidden="true"></div>
                <canvas id="visualizer" width="1200" height="180"></canvas>
            </div>
        </div>

        <div class="player-panel">
            <div class="player-header">
                <h1>My Spotify</h1>
                <span class="status-pill">Live</span>
            </div>

            <p class="now-playing">Now playing</p>
            <h3 id="current-title">Select a song</h3>

            <div class="controls">
                <button id="play-toggle" class="control-button" type="button">Play</button>
                <button id="shuffle-btn" class="control-button" type="button">Shuffle</button>

                <div class="progress-wrap">
                    <input id="progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Track progress">
                    <span id="time-label" class="time-label">0:00 / 0:00</span>
                </div>

                <div class="volume-wrap">
                    <label for="volume">Volume</label>
                    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
                </div>
            </div>

            <audio id="audio-player" preload="metadata"></audio>

            <div class="search-row">
                <input id="search-input" type="text" placeholder="Search for songs or artists..." aria-label="Search songs">
                <button id="search-btn" class="control-button" type="button">Search</button>
            </div>

            <div class="section-header">
                <h2>Online Trending Tracks</h2>
            </div>
            <div id="trending-list" class="trending-list"></div>

            <div class="library-header">
                <h2>Local Tracks</h2>
            </div>
            <ul class="song-list">
                {% for song in songs %}
                <li class="song-item" data-song="{{ song }}" data-src="{{ url_for('download_file', filename=song) }}" data-index="{{ loop.index0 }}">
                    <span class="song-index">{{ loop.index }}</span>
                    <span class="song-title">{{ loop.index }}. {{ song }}</span>
                    <button class="song-play" type="button" aria-label="Play {{ song }}">▶</button>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <script>
        const player = document.getElementById('audio-player');
        const playToggle = document.getElementById('play-toggle');
        const shuffleButton = document.getElementById('shuffle-btn');
        const progress = document.getElementById('progress');
        const volume = document.getElementById('volume');
        const currentTitle = document.getElementById('current-title');
        const timeLabel = document.getElementById('time-label');
        const canvas = document.getElementById('visualizer');
        const canvasContext = canvas.getContext('2d');
        const trendingList = document.getElementById('trending-list');
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-btn');
        const songItems = [...document.querySelectorAll('.song-item')];
        const particleField = document.getElementById('particle-field');

        let audioContext = null;
        let analyser = null;
        let sourceNode = null;
        let currentSongIndex = -1;
        let currentSongUrl = '';
        let currentSongName = '';
        let shuffleEnabled = false;

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) {
                return '0:00';
            }

            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
        }

        function updateProgressDisplay() {
            const duration = player.duration || 0;
            const currentTime = player.currentTime || 0;
            progress.value = duration ? (currentTime / duration) * 100 : 0;
            timeLabel.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
        }

        function markActiveSong(songName) {
            songItems.forEach((item) => {
                const isActive = item.dataset.song === songName;
                item.classList.toggle('active', isActive);
            });
        }

        function setupAudioGraph() {
            if (!audioContext) {
                const AudioCtor = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtor) {
                    return;
                }

                audioContext = new AudioCtor();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;

                sourceNode = audioContext.createMediaElementSource(player);
                sourceNode.connect(analyser);
                analyser.connect(audioContext.destination);
            }
        }

        function drawVisualizer() {
            if (!canvasContext || !analyser) {
                return;
            }

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            canvasContext.clearRect(0, 0, canvas.width, canvas.height);
            analyser.getByteFrequencyData(dataArray);

            const barWidth = canvas.width / bufferLength;
            const gradient = canvasContext.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0, '#00f2ff');
            gradient.addColorStop(1, '#63f5ff');

            for (let i = 0; i < bufferLength; i += 1) {
                const value = dataArray[i] / 255;
                const barHeight = Math.max(8, value * canvas.height);
                const x = i * barWidth;
                const y = canvas.height - barHeight;

                canvasContext.fillStyle = gradient;
                canvasContext.fillRect(x, y, Math.max(1, barWidth - 1), barHeight);
            }

            requestAnimationFrame(drawVisualizer);
        }

        async function playSong(songName, songUrl, songIndex = -1) {
            currentSongName = songName;
            currentSongUrl = songUrl;
            currentSongIndex = songIndex;
            currentTitle.textContent = `Playing: ${songName}`;
            markActiveSong(songName);

            player.src = songUrl;
            player.load();

            try {
                setupAudioGraph();
                await player.play();
            } catch (error) {
                currentTitle.textContent = `Playback blocked for ${songName}. Click Play to resume.`;
                console.warn('Playback was blocked by the browser:', error);
            }
        }

        async function playSongByIndex(index) {
            const item = songItems[index];
            if (!item) {
                return;
            }

            await playSong(item.dataset.song, item.dataset.src, Number(item.dataset.index));
        }

        function getNextIndex() {
            if (!songItems.length) {
                return -1;
            }

            if (shuffleEnabled) {
                let randomIndex = currentSongIndex;
                while (songItems.length > 1 && randomIndex === currentSongIndex) {
                    randomIndex = Math.floor(Math.random() * songItems.length);
                }
                return randomIndex;
            }

            return (currentSongIndex + 1) % songItems.length;
        }

        async function togglePlayback() {
            if (!currentSongUrl) {
                const firstSong = songItems[0];
                if (firstSong) {
                    await playSongByIndex(0);
                }
                return;
            }

            if (player.paused) {
                try {
                    setupAudioGraph();
                    await player.play();
                } catch (error) {
                    console.warn('Playback could not start:', error);
                }
            } else {
                player.pause();
            }
        }

        function updateShuffleButton() {
            shuffleButton.classList.toggle('active', shuffleEnabled);
            shuffleButton.textContent = shuffleEnabled ? 'Shuffle: On' : 'Shuffle';
        }

        async function toggleShuffle() {
            shuffleEnabled = !shuffleEnabled;
            updateShuffleButton();

            if (shuffleEnabled && songItems.length > 1 && currentSongIndex >= 0) {
                const nextIndex = getNextIndex();
                await playSongByIndex(nextIndex);
            }
        }

        function buildParticles() {
            if (!particleField) {
                return;
            }

            const particleCount = 28;
            particleField.innerHTML = '';

            for (let i = 0; i < particleCount; i += 1) {
                const particle = document.createElement('span');
                particle.className = 'particle';

                const left = 6 + Math.random() * 88;
                const top = 10 + Math.random() * 70;
                const size = (Math.random() * 4 + 3).toFixed(2);
                const driftX = (Math.random() * 60 - 30).toFixed(2);
                const driftY = (Math.random() * 50 + 20).toFixed(2);
                const duration = (Math.random() * 8 + 8).toFixed(2);
                const delay = (Math.random() * -10).toFixed(2);

                particle.style.setProperty('--left', `${left}%`);
                particle.style.setProperty('--top', `${top}%`);
                particle.style.setProperty('--size', `${size}px`);
                particle.style.setProperty('--drift-x', `${driftX}px`);
                particle.style.setProperty('--drift-y', `${driftY}px`);
                particle.style.setProperty('--duration', `${duration}s`);
                particle.style.setProperty('--delay', `${delay}s`);

                particleField.appendChild(particle);
            }
        }

        function renderTrendingTracks(tracks) {
            if (!trendingList) {
                return;
            }

            if (!tracks.length) {
                trendingList.innerHTML = '<div class="trending-item"><div class="trending-info"><div class="trending-title">Trending tracks unavailable right now.</div></div></div>';
                return;
            }

            trendingList.innerHTML = tracks.map((track, index) => `
                <div class="trending-item">
                    <div class="trending-art">
                        <img src="${track.image || ''}" alt="${track.title}">
                    </div>
                    <div class="trending-info">
                        <div class="trending-title">${index + 1}. ${track.title}</div>
                        <div class="trending-meta">${track.artist}</div>
                    </div>
                    <button class="preview-button" type="button" ${track.preview ? '' : 'disabled'} data-preview="${track.preview || ''}" data-title="${track.title}" data-artist="${track.artist}">
                        ${track.preview ? 'Play Preview' : 'Preview Unavailable'}
                    </button>
                </div>
            `).join('');

            trendingList.querySelectorAll('.preview-button').forEach((button) => {
                button.addEventListener('click', async () => {
                    const previewUrl = button.dataset.preview;
                    if (!previewUrl) {
                        return;
                    }

                    currentSongIndex = -1;
                    currentSongUrl = previewUrl;
                    currentSongName = button.dataset.title;
                    currentTitle.textContent = `Preview: ${button.dataset.title} — ${button.dataset.artist}`;
                    player.src = previewUrl;
                    player.load();

                    try {
                        setupAudioGraph();
                        await player.play();
                        playToggle.textContent = 'Pause';
                    } catch (error) {
                        console.warn('Preview playback was blocked by the browser:', error);
                    }
                });
            });
        }

        function applyLocalSearch() {
            const query = (searchInput.value || '').trim().toLowerCase();

            songItems.forEach((item) => {
                const songText = item.dataset.song.toLowerCase();
                const matches = !query || songText.includes(query);
                item.style.display = matches ? '' : 'none';
            });
        }

        async function loadTrendingTracks(searchTerm = '') {
            const term = searchTerm.trim() || 'popular';

            try {
                const response = await fetch(`/api/external-trending?term=${encodeURIComponent(term)}`);
                if (!response.ok) {
                    throw new Error('Trending API request failed');
                }

                const data = await response.json();
                renderTrendingTracks(data.tracks || []);
            } catch (error) {
                console.warn('Unable to load trending tracks:', error);
                renderTrendingTracks([]);
            }
        }

        songItems.forEach((item) => {
            item.addEventListener('click', async () => {
                await playSong(item.dataset.song, item.dataset.src, Number(item.dataset.index));
            });
        });

        playToggle.addEventListener('click', async () => {
            await togglePlayback();
        });

        searchButton.addEventListener('click', async () => {
            applyLocalSearch();
            await loadTrendingTracks(searchInput.value);
        });

        searchInput.addEventListener('keydown', async (event) => {
            if (event.key === 'Enter') {
                applyLocalSearch();
                await loadTrendingTracks(searchInput.value);
            }
        });

        shuffleButton.addEventListener('click', async () => {
            await toggleShuffle();
        });

        volume.addEventListener('input', () => {
            player.volume = Number(volume.value);
        });

        progress.addEventListener('input', () => {
            if (!Number.isFinite(player.duration) || player.duration <= 0) {
                return;
            }

            player.currentTime = (Number(progress.value) / 100) * player.duration;
            updateProgressDisplay();
        });

        player.addEventListener('play', () => {
            playToggle.textContent = 'Pause';
            if (audioContext && analyser) {
                requestAnimationFrame(drawVisualizer);
            }
        });

        player.addEventListener('pause', () => {
            playToggle.textContent = 'Play';
        });

        player.addEventListener('ended', async () => {
            if (songItems.length && currentSongIndex >= 0) {
                const nextIndex = getNextIndex();
                await playSongByIndex(nextIndex);
                return;
            }

            playToggle.textContent = 'Play';
        });

        player.addEventListener('loadedmetadata', () => {
            updateProgressDisplay();
        });

        player.addEventListener('timeupdate', updateProgressDisplay);

        player.volume = Number(volume.value);
        updateShuffleButton();
        buildParticles();
        applyLocalSearch();
        currentTitle.textContent = songItems.length ? 'Select a song' : 'No songs found';
        loadTrendingTracks();
    </script>
</body>
</html>
